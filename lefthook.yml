pre-commit:
  commands:
    uv-lock:
      glob: "pyproject.toml"
      run: uv lock
    uv-sort:
      glob: "pyproject.toml"
      run: uvx uv-sort
      stage_fixed: true
    ruff:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    type-check:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npm run type-check
    oxlint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npx oxfmt {staged_files}
      stage_fixed: true
    actionlint:
      glob: ".github/workflows/*.yaml"
      run: actionlint
